<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    
    @keyframes floatWave {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulseECG {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-bg { transform-origin: center; animation: pulseGlow 6s ease-in-out infinite; }
    .floating-card { animation: floatWave 5s ease-in-out infinite; }
    .ecg-line {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: pulseECG 4s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Grid / Orbs (Background layer) -->
  <g class="animated-bg">
    <circle cx="150" cy="80" r="180" fill="url(#glowGrad)"/>
    <circle cx="1050" cy="240" r="200" fill="url(#glowGrad)"/>
  </g>

  <!-- Dynamic ECG / Data Wave in background -->
  <path d="M 50,230 L 350,230 L 380,180 L 400,270 L 430,140 L 460,250 L 480,210 L 500,230 L 1150,230" 
        fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.4" class="ecg-line"/>

  <!-- Background Abstract Tech Cards (Positioned on sides so text stays clear) -->
  <g class="floating-card" opacity="0.6">
    <rect x="920" y="50" width="220" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="950" cy="85" r="14" fill="#0284c7" opacity="0.8"/>
    <path d="M 945,85 L 949,89 L 957,80" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="975" y="73" width="120" height="8" rx="4" fill="#38bdf8"/>
    <rect x="975" y="89" width="80" height="6" rx="3" fill="#64748b"/>
  </g>

  <g class="floating-card" opacity="0.5" style="animation-delay: -2.5s;">
    <rect x="950" y="150" width="200" height="65" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="970" y="170" width="90" height="8" rx="4" fill="#a855f7"/>
    <rect x="970" y="186" width="130" height="6" rx="3" fill="#64748b"/>
  </g>

  <!-- Main Content Foreground (Fully readable and clean) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 50)">
      <rect width="260" height="32" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="18" cy="16" r="6" fill="#38bdf8"/>
      <text x="34" y="21" class="badge-text">CLINICAL TRIAL ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#shadow)">Awesome Clinical Trial Management System</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="175" class="subtitle">Curated CTMS SaaS Platforms, Open-Source EDC/CDM Tools &amp; Site Operations Systems</text>

    <!-- Decorative Accent Line -->
    <rect x="0" y="205" width="480" height="4" rx="2" fill="url(#accentGrad)"/>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 235)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="20" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">🏥 Site Operations</text>

      <!-- Tag 2 -->
      <rect x="152" y="0" width="135" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="166" y="20" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">📊 EDC &amp; CDMS</text>

      <!-- Tag 3 -->
      <rect x="299" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="313" y="20" font-family="system-ui" font-size="13" font-weight="600" fill="#cbd5e1">⚡ Regulatory &amp; eTMF</text>
    </g>
  </g>
</svg>
